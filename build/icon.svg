<?xml version="1.0" encoding="UTF-8"?>
<!-- archamp's app icon: three bars of the spectrum analyser the player draws,
     in the colours base-2.91.wsz's VISCOLOR.TXT gives it - green at the floor
     through yellow to red at the top.

     It is what archamp draws, not what Winamp's logo is: the bolt is the
     Llama Group's trademark and is not archamp's to wear.

     Three rather than the seven of the about window's mark, because this is
     the icon a launcher, a switcher or a dock draws, and none of them draw it
     anywhere near the size that seven bars need. build/icon-bare.svg is the
     full reading, for the one place there is room for it; build/icon-tray.svg
     is this one again without the tile, for a system tray, which is already a
     dark bar and does not want a second one drawn on it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="56" fill="#16181d"/>
  <defs>
    <linearGradient id="spectrum" x1="0.000" y1="30.000" x2="0.000" y2="226.000" gradientUnits="userSpaceOnUse">
      <stop offset="0.0000" stop-color="#EF3110"/>
      <stop offset="0.0667" stop-color="#CE2910"/>
      <stop offset="0.1333" stop-color="#D65A00"/>
      <stop offset="0.2000" stop-color="#D66600"/>
      <stop offset="0.2667" stop-color="#D67300"/>
      <stop offset="0.3333" stop-color="#C67B08"/>
      <stop offset="0.4000" stop-color="#DEA518"/>
      <stop offset="0.4667" stop-color="#D6B521"/>
      <stop offset="0.5333" stop-color="#BDDE29"/>
      <stop offset="0.6000" stop-color="#94DE21"/>
      <stop offset="0.6667" stop-color="#29CE10"/>
      <stop offset="0.7333" stop-color="#32BE10"/>
      <stop offset="0.8000" stop-color="#39B510"/>
      <stop offset="0.8667" stop-color="#319C08"/>
      <stop offset="0.9333" stop-color="#299400"/>
      <stop offset="1.0000" stop-color="#188408"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="38.493" y="122.235" width="48.347" height="103.765" fill="url(#spectrum)"/>
    <rect x="103.827" y="30.000" width="48.347" height="196.000" fill="url(#spectrum)"/>
    <rect x="169.160" y="87.647" width="48.347" height="138.353" fill="url(#spectrum)"/>
  </g>
</svg>
