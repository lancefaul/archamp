<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Update archamp</title>
    <style>
      /* The same components as the player's menus and the skin browser, which
         are Omarchy's own: a pinned title, PanelSeparator between sections,
         the shell's popup row height and control inset, its state fills. This
         window is not zoomed, so the shell's 12px base is used directly. */
      :root {
        --rem: 12px;
        --bg: #14151a;
        --fg: #e2e2e6;
        --dim: #a1a1a4;
        --rule: rgba(226, 226, 230, 0.12);
        --fill: rgba(226, 226, 230, 0.04);
        --hover: rgba(226, 226, 230, 0.08);
        --accent: #7aa2f7;
        --error: #d05c5c;
        --inset: calc(var(--rem) * 0.833);
        --row: calc(var(--rem) * 2.333);
        --caption: calc(var(--rem) * 0.833);
        --title: calc(var(--rem) * 1.167);
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", monospace;
        font-size: var(--rem);
      }
      body {
        display: grid;
        grid-template-rows: auto auto 1fr auto auto auto;
        overflow: hidden;
      }
      hr {
        height: 1px;
        margin: 0;
        border: none;
        background: var(--rule);
      }
      header {
        padding: calc(var(--rem) * 0.833) var(--inset) calc(var(--rem) * 0.667);
      }
      h1 {
        margin: 0;
        font-size: var(--title);
        font-weight: bold;
      }
      .meta {
        margin: calc(var(--rem) * 0.25) 0 0;
        font-size: var(--caption);
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      /* The notes, as written. A section per heading, each with its own header
         and dividing line, as the rest of the window has. */
      main {
        overflow-y: auto;
        padding: var(--inset);
        scrollbar-width: thin;
        scrollbar-color: var(--rule) transparent;
      }
      .section + .section {
        margin-top: calc(var(--rem) * 1.333);
      }
      .section h2 {
        margin: 0 0 calc(var(--rem) * 0.5);
        font-size: var(--caption);
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .section h2 + hr {
        margin-bottom: calc(var(--rem) * 0.667);
      }
      .section p {
        margin: 0 0 calc(var(--rem) * 0.5);
        white-space: pre-wrap;
        line-height: 1.5;
      }
      .section p:last-child {
        margin-bottom: 0;
      }
      .section strong {
        font-weight: bold;
      }
      .section .bullet {
        padding-left: calc(var(--rem) * 1.167);
        text-indent: calc(var(--rem) * -1.167);
      }
      .command {
        padding: calc(var(--rem) * 0.667) var(--inset);
      }
      .command .lead {
        margin: 0 0 calc(var(--rem) * 0.5);
        font-size: var(--caption);
        color: var(--dim);
      }
      .box {
        display: flex;
        align-items: flex-start;
        gap: calc(var(--rem) * 0.5);
        padding: calc(var(--rem) * 0.667);
        background: var(--fill);
        border: 1px solid var(--rule);
      }
      #command {
        flex: 1;
        min-width: 0;
        margin: 0;
        font: inherit;
        font-size: var(--caption);
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
        cursor: text;
      }
      #result {
        margin: calc(var(--rem) * 0.5) 0 0;
        font-size: var(--caption);
        color: var(--dim);
        white-space: pre-wrap;
      }
      #result.failed {
        color: var(--error);
      }
      #result[hidden] {
        display: none;
      }
      footer {
        display: flex;
        gap: calc(var(--rem) * 0.5);
        padding: calc(var(--rem) * 0.667) var(--inset);
      }
      button {
        height: var(--row);
        padding: 0 calc(var(--rem) * 1.333);
        background: var(--fill);
        border: 1px solid var(--rule);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: var(--hover);
      }
      button.primary {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        color: var(--dim);
        border-color: var(--rule);
        cursor: default;
      }
      button.copy {
        height: auto;
        padding: calc(var(--rem) * 0.25) calc(var(--rem) * 0.667);
        font-size: var(--caption);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Update archamp</h1>
      <p class="meta" id="versions"></p>
    </header>
    <hr />
    <main id="notes"></main>
    <hr />
    <div class="command">
      <p class="lead">Update runs this command. You can also copy it into a terminal.</p>
      <div class="box">
        <pre id="command"></pre>
        <button id="copy" class="copy" type="button">Copy</button>
      </div>
      <p id="result" hidden></p>
    </div>
    <hr />
    <footer>
      <button id="update" class="primary" type="button">Update</button>
      <button id="cancel" type="button">Cancel</button>
    </footer>
    <script src="update.js"></script>
  </body>
</html>
