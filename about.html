<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:" />
    <title>About archamp</title>
    <style>
      /* An about box: the mark, who it is, and what it stands on. The colours
         are the desktop's (see theme.js), as everywhere else in archamp; this
         window is not zoomed, so the shell's 12px base is used directly. */
      :root {
        --rem: 12px;
        --bg: #14151a;
        --fg: #e2e2e6;
        --dim: #a1a1a4;
        --rule: rgba(226, 226, 230, 0.12);
        --fill: rgba(226, 226, 230, 0.04);
        --hover: rgba(226, 226, 230, 0.08);
        --accent: #7aa2f7;
        --inset: calc(var(--rem) * 0.833);
        --row: calc(var(--rem) * 2.333);
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", monospace;
        font-size: var(--rem);
        user-select: none;
        cursor: default;
      }
      body {
        overflow: hidden;
      }
      /* Dead centre of the window, not of what the footer leaves over. */
      main {
        height: 100%;
      }
      /* The way out, where every other window of archamp's puts it: a square
         of the same border and fill as the player's own close button. */
      #close {
        position: fixed;
        top: var(--inset);
        right: var(--inset);
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--row);
        height: var(--row);
        padding: 0;
        background: var(--fill);
        border: 1px solid var(--rule);
        color: var(--dim);
        font: inherit;
        line-height: 1;
        cursor: pointer;
      }
      #close:hover {
        background: var(--hover);
        border-color: var(--accent);
        color: var(--accent);
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: calc(var(--rem) * 0.333);
        padding: calc(var(--rem) * 2);
        text-align: center;
      }
      footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
      }
      /* As wide as the name below it, so its seven bars stand one over each
         letter: JetBrains Mono advances 0.6em and the h1 adds 0.01em of
         letter-spacing to every character, so a character is 0.61em of the
         title's size and the word is seven of them. The mark's own viewBox is
         that width by this height, so nothing is stretched. */
      #logo {
        width: calc(var(--rem) * 2.667 * 0.61 * 7);
        height: calc(var(--rem) * 5);
        margin-bottom: calc(var(--rem) * 1.333);
      }
      h1 {
        margin: 0;
        font-size: calc(var(--rem) * 2.667);
        font-weight: bold;
        letter-spacing: 0.01em;
      }
      .tagline {
        margin: calc(var(--rem) * 0.25) 0 0;
        font-size: calc(var(--rem) * 1.167);
      }
      /* Winamp really whipped the llama's ass. */
      .tagline s {
        text-decoration-thickness: 1px;
      }
      .version {
        margin: calc(var(--rem) * 0.333) 0 0;
        font-size: var(--rem);
        color: var(--dim);
      }
      footer {
        padding: calc(var(--rem) * 1.667);
        text-align: center;
        font-size: var(--rem);
        color: var(--dim);
      }
      footer a {
        color: var(--fg);
        text-decoration: underline;
        cursor: pointer;
      }
      footer a:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <button id="close" type="button" title="Close" aria-label="Close">&#xf0156;</button>
    <main>
      <img id="logo" alt="" />
      <h1>archamp</h1>
      <p class="tagline">An ode to the <s>GOAT</s> LLAMA</p>
      <p class="version" id="version"></p>
    </main>
    <footer>Powered by <a id="webamp" href="https://webamp.org/">Webamp</a></footer>
    <script src="about.js"></script>
  </body>
</html>
