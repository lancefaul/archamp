<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>archamp</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* Title bars are native drag regions, so dragging one moves the real
         window. Everything webamp itself wouldn't start a drag from (buttons,
         sliders, the shade-mode controls drawn over the main title bar, open
         menus) opts back out. Chromium applies regions in document order, so
         a later no-drag element punches a hole in an earlier drag region. */
      #webamp :not(.draggable),
      #webamp-context-menu,
      #webamp-context-menu *,
      #archamp-menu,
      #archamp-menu *,
      #archamp-prompt,
      #archamp-prompt * {
        -webkit-app-region: no-drag;
      }
      #title-bar,
      #equalizer-window .draggable,
      .playlist-top,
      .playlist-top .draggable,
      #playlist-window-shade,
      #playlist-window-shade .draggable {
        -webkit-app-region: drag;
      }
      /* While a menu is open, pressing a title bar closes the menu instead of
         moving the window, like a native menu. */
      html.menu-open #webamp * {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="renderer.js"></script>
  </body>
</html>
