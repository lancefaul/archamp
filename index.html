<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>archamp</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* Title bars are native drag regions, so dragging one moves the real
         window. Everything webamp itself wouldn't start a drag from (buttons,
         sliders, the shade-mode controls drawn over the main title bar, open
         menus) opts back out. Chromium applies regions in document order, so
         a later no-drag element punches a hole in an earlier drag region. */
      #webamp :not(.draggable),
      #webamp-context-menu,
      #webamp-context-menu *,
      #archamp-menu,
      #archamp-menu *,
      #archamp-prompt,
      #archamp-prompt * {
        -webkit-app-region: no-drag;
      }
      #title-bar,
      #equalizer-window .draggable,
      .playlist-top,
      .playlist-top .draggable,
      #playlist-window-shade,
      #playlist-window-shade .draggable {
        -webkit-app-region: drag;
      }
      /* While a menu is open, pressing a title bar closes the menu instead of
         moving the window, like a native menu. */
      html.menu-open #webamp * {
        -webkit-app-region: no-drag;
      }
      /* Chromium works out where the drag regions are when the elements
         carrying them change, and a window that has only just been shown has
         not changed since it was mapped — so the first drag after opening
         archamp, or after bringing it back from hidden, did nothing. Anything
         that re-rendered a title bar fixed it, which is why clicking the
         equalizer first worked: that takes webamp's `selected` class off the
         main window's title bar, and changing the element is what makes
         Chromium look again. archamp turns this class on and off after a show
         to make that change deliberately. See refreshDragRegions. */
      html.regions-stale #webamp * {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="renderer.js"></script>
  </body>
</html>
